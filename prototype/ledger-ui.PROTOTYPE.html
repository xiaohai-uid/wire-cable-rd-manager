<!DOCTYPE html>
<!--
  ============================================================================
  这是一次性原型（THROWAWAY PROTOTYPE），不是生产代码。
  ----------------------------------------------------------------------------
  回答的问题：「测试台账这块屏幕应该长什么样、以什么为中心组织？」

  四个信息架构完全不同的变体，用 ?v=A|B|C|D 切换（底部浮动条 / ← → 方向键）：
    A 批次工作台   —— 左侧批次列表 + 右侧录入网格，以「批次」为第一公民
    B 沉浸录入台   —— 无侧栏，全宽大网格 + 右侧实时判定摘要，为录入速度服务
    C 质量热力图   —— 首屏是 测试项 × 产品 的不良率矩阵，点格下钻，录入是附属动作
    D 键盘优先     —— 近乎无 chrome 的超高密度表格 + Cmd/Ctrl+K 命令面板

  数据是真的：取自旧仓库 seed-real-data.js（5 产品 / 52 测试模板项 / 6 批次 / 62 条记录 / 3 条不合格 / 不良率 4.84%）。
  判定引擎按 ADR 0004 的正确解析方式实现（区分 比较符 / 数值 / 单位，不再剥字符）。

  选定变体后：赢家重写进正式代码，本文件连同落选变体移到一次性分支，不留在 main。
  ============================================================================
-->

  #sw .dots i.on{background:#5eead4}

/* =====================================================================
   2. 判定引擎 —— 按 ADR 0004 实现：显式区分 比较符 / 数值 / 单位
      旧版 s.replace(/[^0-9.]/g,'') 会把 ≥1.5mm2 读成 1.52，这里不会。
   ===================================================================== */
const NUM = '(-?\\d+(?:\\.\\d+)?)';
function parseSpec(raw){
  const s = String(raw ?? '').trim();
  if(!s) return {kind:'none'};
  if(/^(合格|通过|OK|PASS)$/i.test(s)) return {kind:'qualitative', expected:s};
  let m;
  if(m = s.match(new RegExp('^[≤<]=?\\s*'+NUM+'\\s*(.*)$')))            return {kind:'max',       limit:+m[1], unit:m[2].trim()};
  if(m = s.match(new RegExp('^[≥>]=?\\s*'+NUM+'\\s*(.*)$')))            return {kind:'min',       limit:+m[1], unit:m[2].trim()};
  if(m = s.match(new RegExp('^'+NUM+'\\s*±\\s*'+NUM+'\\s*(.*)$')))      return {kind:'tolerance', center:+m[1], tol:+m[2], unit:m[3].trim()};
  if(m = s.match(new RegExp('^'+NUM+'\\s*[~～]\\s*'+NUM+'\\s*(.*)$')))  return {kind:'range',     lower:+m[1], upper:+m[2], unit:m[3].trim()};
  return {kind:'unparseable', raw:s};
}
const r4 = n => Math.round(n*1e4)/1e4;
function judge(rule, vals){
  const nums = vals.filter(v => v!==null && v!=='' && !isNaN(v)).map(Number);
  if(!nums.length) return {verdict:'未录', avg:null};
  const avg = r4(nums.reduce((a,b)=>a+b,0)/nums.length);
  const all = f => nums.every(f) ? '合格' : '不合格';
  switch(rule.kind){
    case 'max':         return {verdict:all(v=>v<=rule.limit), avg};
    case 'min':         return {verdict:all(v=>v>=rule.limit), avg};
    case 'tolerance':   return {verdict:all(v=>v>=rule.center-rule.tol && v<=rule.center+rule.tol), avg};
    case 'range':       return {verdict:all(v=>v>=rule.lower && v<=rule.upper), avg};
    case 'qualitative': return {verdict:all(v=>v===1), avg:null};
    case 'unparseable': return {verdict:'规格无法识别', avg};
    default:            return {verdict:'待判定', avg};
  }
}
/** 单个测量值是否越界（用于把具体那个数标红，而不是整行含糊标红） */
function valBad(rule, v){
  if(v===null||v===''||isNaN(v)) return false;
  const n = +v;
  switch(rule.kind){
    case 'max':       return n > rule.limit;
    case 'min':       return n < rule.limit;
    case 'tolerance': return n < rule.center-rule.tol || n > rule.center+rule.tol;
    case 'range':     return n < rule.lower || n > rule.upper;
    default:          return false;
  }
}

/* 派生：给每个批次/每行算好判定 */
const MODEL = Object.fromEntries(PRODUCTS.map(p=>[p.model,p]));
BATCHES.forEach((b,bi)=>{
  b.id = bi;
  b.product = MODEL[b.model];
  b.data.forEach(row=>{
    row.rule = parseSpec(row.spec);
    const j = judge(row.rule, row.v);
    row.verdict = j.verdict; row.avg = j.avg;
    row.qualitative = row.rule.kind === 'qualitative';
  });
  b.fail  = b.data.filter(r=>r.verdict==='不合格').length;
  b.total = b.data.length;
  b.rate  = b.total ? b.fail/b.total*100 : 0;
});
const ALL_ROWS = BATCHES.flatMap(b=>b.data.map(r=>({...r, batch:b.batch, model:b.model, date:b.date, tester:b.tester})));
const STAT = {
  total: ALL_ROWS.length,
  fail:  ALL_ROWS.filter(r=>r.verdict==='不合格').length,
};
STAT.pass = STAT.total - STAT.fail;
STAT.rate = (STAT.fail/STAT.total*100);

/* =====================================================================

const h = (html) => { const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; };
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n===null||n===undefined ? '—' : (typeof n==='number' ? String(n) : n);
function verdictTag(v){
  const cls = v==='合格'?'pass' : v==='不合格'?'fail' : v==='未录'?'none' : 'wait';

}

    </nav>

  </div>`;
}
/** 网格键盘导航：Enter/↑↓ 上下移动，Tab 天然左右移动 */
function wireGridKeys(root){
  root.addEventListener('keydown', e=>{
    if(!(e.target instanceof HTMLInputElement)) return;
    if(e.key!=='Enter' && e.key!=='ArrowUp' && e.key!=='ArrowDown') return;
    e.preventDefault(); e.stopPropagation();
    const cells = [...root.querySelectorAll('input.cellin')];
    const i = cells.indexOf(e.target);
    const cols = +root.dataset.cols || 3;
    const next = (e.key==='ArrowUp') ? i-cols : i+cols;
    if(cells[next]){ cells[next].focus(); cells[next].select(); }
  });
}

   主要交互对象：右侧网格单元格。

        </div>

      <main style="overflow:auto" id="pane"></main>
    </div>
  </div>`);

  const renderList = ()=>{
    el.querySelector('#blist').innerHTML = BATCHES.map(b=>`
      <button data-b="${b.id}" style="
        display:block; width:100%; text-align:left; padding:9px 14px;

          ${b.fail ? `<span class="tag fail">${b.fail} 不合格</span>` : `<span class="tag pass">全合格</span>`}
        </div>
        <div class="num" style="color:var(--ink-3); font-size:11px; margin-top:2px">${esc(b.batch)}</div>
        <div style="color:var(--ink-3); font-size:11px">${b.date} · ${esc(b.tester)} · ${b.total} 项</div>
      </button>`).join('');
    el.querySelectorAll('#blist button[data-b]').forEach(btn=>{
      btn.onclick = ()=>{ sel = +btn.dataset.b; renderList(); renderPane(); };
    });
  };

  const renderPane = ()=>{
    const b = BATCHES[sel];
    const pane = el.querySelector('#pane');
    pane.innerHTML = `
      <div style="padding:14px 18px; border-bottom:1px solid var(--line); background:var(--panel)">
        <div style="display:flex; align-items:baseline; gap:10px; flex-wrap:wrap">
          <h1 style="font-size:16px; font-weight:650; letter-spacing:-.01em">${esc(b.model)}</h1>
          <span class="num" style="color:var(--ink-2)">${esc(b.batch)}</span>
          <span style="color:var(--ink-3)">${esc(b.product.name)}</span>
        </div>
        <div style="color:var(--ink-3); font-size:11.5px; margin-top:3px">
          ${esc(b.product.drawing)} · ${esc(b.product.std)} · 测试日 ${b.date} · 测试员 ${esc(b.tester)}
        </div>
      </div>
      <div style="display:flex; gap:18px; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--panel); align-items:center">
        <span>合格 <b class="num" style="color:var(--pass)">${b.total-b.fail}</b></span>
        <span>不合格 <b class="num" style="color:var(--fail)">${b.fail}</b></span>
        <span>不良率 <b class="num" style="color:${b.fail?'var(--fail)':'var(--pass)'}">${b.rate.toFixed(1)}%</b></span>
        <span style="flex:1"></span>
        <button style="border:1px solid var(--line-strong); padding:4px 10px; border-radius:5px; background:#fff">从 Excel 粘贴</button>
        <button style="background:var(--accent); color:#fff; padding:5px 14px; border-radius:5px; font-weight:600">保存整批 (${b.total} 行)</button>
      </div>
      <div data-cols="3" id="gridA" style="padding:0 18px 80px">
        <table>
          <thead><tr>
            <th style="width:26px">#</th><th>测试项目</th><th>规格要求</th>
            <th class="r" style="width:92px">值 1</th><th class="r" style="width:92px">值 2</th><th class="r" style="width:92px">值 3</th>
            <th class="r" style="width:88px">平均</th><th style="width:84px">判定</th>
          </tr></thead>
          <tbody>${b.data.map((r,i)=>rowA(r,i)).join('')}</tbody>
        </table>
      </div>`;
    wireGridKeys(pane.querySelector('#gridA'));
  };

  const rowA = (r,i)=>`
    <tr class="${r.verdict==='不合格'?'failrow':''}">
      <td class="num" style="color:var(--ink-3)">${i+1}</td>
      <td>${esc(r.item)}</td>
      <td class="num" style="color:var(--ink-2)">${esc(r.spec)}</td>
      ${r.qualitative
        ? `<td colspan="3"><div class="qual">
             <button class="on">合格</button><button class="no">不合格</button>
           </div></td>`
        : r.v.map(v=>`<td><input class="cellin ${valBad(r.rule,v)?'bad':''}" value="${v}"></td>`).join('')}
      <td class="r num" style="color:var(--ink-2)">${fmt(r.avg)}</td>
      <td>${verdictTag(r.verdict)}</td>
    </tr>`;

  renderList(); renderPane();
  return el;
}

/* =====================================================================
   变体 C —— 质量热力图：首屏是 测试项 × 产品 的不良率矩阵
   信息架构：把系统当「质量分析工具」，录入退为右上角的附属动作。
   主要交互对象：热力图格子（点击下钻到明细）。
   ===================================================================== */
function VariantC(){
  // 聚合：每个 (测试项, 产品) 组合的记录与不合格数
  const cellMap = new Map();
  ALL_ROWS.forEach(r=>{
    const k = r.item+'||'+r.model;
    if(!cellMap.has(k)) cellMap.set(k, {rows:[], fail:0});
    const c = cellMap.get(k); c.rows.push(r); if(r.verdict==='不合格') c.fail++;
  });
  const items = [...new Set(ALL_ROWS.map(r=>r.item))];
  const models = PRODUCTS.map(p=>p.model);

  const shade = (c)=>{
    if(!c) return {bg:'#fafafa', fg:'#d4d4d8', txt:''};
    const rate = c.fail/c.rows.length;
    if(rate===0)   return {bg:'#f0fdf4', fg:'#15803d', txt:'✓'};
    if(rate<=0.34) return {bg:'#fee2e2', fg:'#b91c1c', txt:Math.round(rate*100)+'%'};
    if(rate<=0.67) return {bg:'#fca5a5', fg:'#7f1d1d', txt:Math.round(rate*100)+'%'};
    return {bg:'#ef4444', fg:'#fff', txt:Math.round(rate*100)+'%'};
  };

  const el = h(`<div>
    ${topbar('ledger')}
    <div style="max-width:1160px; margin:0 auto; padding:20px 20px 90px">
      <div style="display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:16px; gap:16px; flex-wrap:wrap">
        <div>
          <h1 style="font-size:17px; font-weight:650; letter-spacing:-.01em">质量矩阵</h1>
          <p style="color:var(--ink-3); font-size:12px; margin-top:2px">
            ${STAT.total} 条记录 · ${items.length} 个测试项 × ${models.length} 个产品 · 颜色深浅代表该组合的不良率
          </p>
        </div>
        <div style="display:flex; gap:8px">
          <button style="border:1px solid var(--line-strong); padding:6px 12px; border-radius:5px; background:#fff">导出 CSV</button>
          <button style="background:var(--accent); color:#fff; padding:7px 16px; border-radius:5px; font-weight:600">+ 录入新批次</button>
        </div>
      </div>

      <div style="display:flex; gap:18px; margin-bottom:16px">
        ${[['总记录',STAT.total,'var(--ink)'],['合格',STAT.pass,'var(--pass)'],['不合格',STAT.fail,'var(--fail)'],['不良率',STAT.rate.toFixed(2)+'%','var(--fail)']]
          .map(([k,v,c])=>`<div style="background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 16px; min-width:110px">
            <div style="font-size:10.5px; color:var(--ink-3); letter-spacing:.04em">${k}</div>
            <div class="num" style="font-size:22px; font-weight:650; color:${c}; letter-spacing:-.02em">${v}</div>
          </div>`).join('')}
      </div>

      <div style="background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:auto">
        <table style="font-size:12px">
          <thead><tr>
            <th style="min-width:150px; position:sticky; left:0; background:var(--panel); z-index:2">测试项目</th>
            ${models.map(m=>`<th class="r" style="min-width:104px; text-align:center">${esc(m)}</th>`).join('')}
          </tr></thead>
          <tbody>
            ${items.map(it=>`<tr>
              <td style="position:sticky; left:0; background:var(--panel); font-weight:500; border-right:1px solid var(--line)">${esc(it)}</td>
              ${models.map(m=>{
                const c = cellMap.get(it+'||'+m); const s = shade(c);
                return `<td style="padding:3px; text-align:center">
                  <button ${c?`data-cell="${esc(it)}||${esc(m)}"`:'disabled'} style="
                    width:100%; height:26px; border-radius:4px; background:${s.bg}; color:${s.fg};
                    font-family:var(--mono); font-size:11px; font-weight:600;
                    cursor:${c?'pointer':'default'}">${s.txt}</button></td>`;
              }).join('')}
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div id="drillC" style="margin-top:16px"></div>
    </div>
  </div>`);

  const drill = el.querySelector('#drillC');
  const showDrill = (key)=>{
    const [it,m] = key.split('||');
    const c = cellMap.get(key);
    drill.innerHTML = `
      <div style="background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden">
        <div style="padding:11px 16px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:10px">
          <b style="font-size:13.5px">${esc(it)}</b>
          <span style="color:var(--ink-3)">${esc(m)}</span>
          <span style="flex:1"></span>
          <span style="color:var(--ink-3); font-size:11.5px">${c.rows.length} 次测试 · ${c.fail} 次不合格</span>
        </div>
        <table>
          <thead><tr><th>日期</th><th>批号</th><th>规格</th>
            <th class="r">值 1</th><th class="r">值 2</th><th class="r">值 3</th><th class="r">平均</th><th>判定</th><th>测试员</th></tr></thead>
          <tbody>${c.rows.map(r=>`<tr class="${r.verdict==='不合格'?'failrow':''}">
            <td class="num">${r.date}</td><td class="num">${esc(r.batch)}</td>
            <td class="num" style="color:var(--ink-2)">${esc(r.spec)}</td>
            ${r.qualitative ? `<td colspan="3" style="color:var(--ink-3)">定性判定</td>`
              : r.v.map(v=>`<td class="r num" style="${valBad(r.rule,v)?'color:var(--fail); font-weight:600':''}">${v}</td>`).join('')}
            <td class="r num">${fmt(r.avg)}</td><td>${verdictTag(r.verdict)}</td><td>${esc(r.tester)}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>`;
    drill.scrollIntoView({behavior:'smooth', block:'nearest'});
  };
  el.querySelectorAll('button[data-cell]').forEach(b=>{ b.onclick = ()=>showDrill(b.dataset.cell); });
  showDrill('回波损耗||SYV-75-5'); // 默认展开那条真实的不合格项
  return el;
}

    {t:'从 Excel 粘贴导入',   s:'导入'},
    {t:'导出当前视图为 CSV',  s:'导出'},
    {t:'为选中批次生成报告',  s:'报告', k:'R'},

        const on = o===btn;
        o.style.background = on?'var(--ink)':'#fff';
        o.style.color = on?'#fff':'var(--ink-2)';
        o.style.borderColor = on?'var(--ink)':'var(--line-strong)';
      });
      drawTbl();
    };
  });

  // 命令面板
  const kbar = el.querySelector('#kbar'), kin = el.querySelector('#kin'), klist = el.querySelector('#klist');
  const drawK = ()=>{
    const q = kin.value.trim().toLowerCase();
    const cmds = CMDS.filter(c=>!q || c.t.toLowerCase().includes(q));
    const hits = q ? ALL_ROWS.filter(r=>
      (r.batch+r.model+r.item).toLowerCase().includes(q)).slice(0,6) : [];
    klist.innerHTML =
      (cmds.length?`<div style="font-size:10.5px; color:var(--ink-3); padding:6px 10px; letter-spacing:.04em">命令</div>`:'') +
      cmds.map(c=>`<div style="display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:6px">
        <span class="tag none">${c.s}</span><span style="flex:1">${esc(c.t)}</span>
        ${c.k?`<span class="kbd">${c.k}</span>`:''}</div>`).join('') +
      (hits.length?`<div style="font-size:10.5px; color:var(--ink-3); padding:6px 10px; letter-spacing:.04em">记录</div>`:'') +
      hits.map(r=>`<div style="display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:6px">
        ${verdictTag(r.verdict)}<span style="flex:1">${esc(r.item)} <span style="color:var(--ink-3)">${esc(r.model)}</span></span>
        <span class="num" style="color:var(--ink-3); font-size:11px">${esc(r.batch)}</span></div>`).join('') ||
      (cmds.length?'':`<div style="padding:14px 10px; color:var(--ink-3)">无匹配</div>`);
    [...klist.children].forEach(c=>{
      c.onmouseenter = ()=>c.style.background='var(--accent-soft)';
      c.onmouseleave = ()=>c.style.background='transparent';
    });
  };
  const openK = ()=>{ kbar.style.display='block'; kin.value=''; drawK(); kin.focus(); };
  const closeK = ()=>{ kbar.style.display='none'; };
  el.querySelector('#openK').onclick = openK;
  kin.oninput = drawK;
  kbar.onclick = e=>{ if(e.target===kbar) closeK(); };
  el._onKey = e=>{
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openK(); }
    if(e.key==='Escape') closeK();
  };
  document.addEventListener('keydown', el._onKey);

  drawTbl();
  return el;
}

/* =====================================================================
   4. 切换器
   ===================================================================== */
const VARIANTS = [
  {k:'A', name:'批次工作台 · 左列表右网格', build:VariantA},
  {k:'B', name:'沉浸录入台 · 全宽网格+实时摘要', build:VariantB},
  {k:'C', name:'质量热力图 · 矩阵下钻', build:VariantC},
  {k:'D', name:'键盘优先 · 高密度表+命令面板', build:VariantD},
];
let cur = 0, mounted = null;

function mount(i){
  const v = VARIANTS[i];
  if(mounted && mounted._onKey) document.removeEventListener('keydown', mounted._onKey);
  const app = document.getElementById('app');
  app.innerHTML = '';
  mounted = v.build();
  app.appendChild(mounted);
  window.scrollTo(0,0);
  document.getElementById('swLbl').innerHTML = `${v.k} <small>${esc(v.name)}</small>`;
  document.getElementById('swDots').innerHTML = VARIANTS.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('');
  const u = new URL(location); u.searchParams.set('v', v.k); history.replaceState(null,'',u);
  cur = i;
}
const go = d => mount((cur + d + VARIANTS.length) % VARIANTS.length);
document.getElementById('swPrev').onclick = ()=>go(-1);
document.getElementById('swNext').onclick = ()=>go(1);
document.addEventListener('keydown', e=>{
  const t = e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.isContentEditable)) return; // 不抢输入框的方向键
  if(e.key==='ArrowLeft')  go(-1);
  if(e.key==='ArrowRight') go(1);
});

const want = (new URL(location)).searchParams.get('v');
mount(Math.max(0, VARIANTS.findIndex(v=>v.k===(want||'A').toUpperCase())));
</script>
