<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOM管理 - 线材研发管理系统</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="navbar">
  <div class="logo">📐 <span>线材研发</span>管理系统</div>
  <div class="nav-links">
    <a href="/">📊 仪表盘</a><a href="/products.html">📦 产品</a><a href="/ledger.html">📋 测试台账</a>
    <a href="/bom.html" class="active">📑 BOM</a><a href="/process.html">🔧 工艺记录</a><a href="/reports.html">📝 测试报告</a>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <input id="globalSearch" placeholder="搜索..." style="padding:6px 12px;border:none;border-radius:6px;font-size:13px;width:160px;background:rgba(255,255,255,0.15);color:#fff;outline:none" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()" style="background:none;border:none;color:#fff;cursor:pointer;font-size:16px">🔍</button>
  </div>
</div>
<div class="container">
  <div class="page-header"><h2>📑 BOM 物料清单</h2><button class="btn btn-primary" onclick="showAddBom()">+ 新增BOM</button></div>
  <div id="bomLoading" class="loading-overlay"><div class="loading-spinner"></div></div>
  <div id="bomList"></div>
</div>

<div class="modal-overlay" id="modal" style="display:none" onclick="if(event.target===this)hideModal()">
  <div class="modal" style="min-width:600px"><h3 id="modalTitle">新增BOM</h3>
    <div class="form-grid">
      <div class="form-group"><label>BOM编号 *</label><input id="fBomNo" maxlength="200" placeholder="如 BOM-XH-100P-V1.0"></div>
      <div class="form-group"><label>产品型号 *</label><select id="fModel"></select></div>
      <div class="form-group"><label>图纸编号</label><input id="fDrawing" maxlength="200" placeholder="对应图纸编号"></div>
      <div class="form-group"><label>版本</label><input id="fVersion" value="V1.0"></div>
      <div class="form-group"><label>编制人</label><input id="fCreator" maxlength="200"></div>
      <div class="form-group"><label>描述</label><input id="fDesc" maxlength="500"></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveBom()">保存</button>
      <button class="btn btn-outline" onclick="hideModal()">取消</button>
    </div>
  </div>
</div>

<!-- BOM物料录入模态框 -->
<div class="modal-overlay" id="itemModal" style="display:none" onclick="if(event.target===this)hideItemModal()">
  <div class="modal" style="min-width:500px"><h3>添加物料</h3>
    <div class="form-grid">
      <div class="form-group"><label>行号 *</label><input id="fiRowNo" type="number" value="1"></div>
      <div class="form-group"><label>物料编码</label><input id="fiCode" maxlength="200" placeholder="如 MAT-001"></div>
      <div class="form-group"><label>物料名称 *</label><input id="fiName" maxlength="200" placeholder="如 镀锡铜线"></div>
      <div class="form-group"><label>规格型号</label><input id="fiSpec" maxlength="500" placeholder="如 0.1mm×7"></div>
      <div class="form-group"><label>材质</label><input id="fiMaterial" maxlength="200" placeholder="如 镀锡铜"></div>
      <div class="form-group"><label>单位</label><select id="fiUnit"><option value="">请选择</option><option value="m">米</option><option value="kg">千克</option><option value="pcs">个</option><option value="m²">平方米</option></select></div>
      <div class="form-group"><label>用量 *</label><input id="fiQty" type="number" step="any" value="1"></div>
      <div class="form-group"><label>损耗率%</label><input id="fiLoss" type="number" step="any" value="0"></div>
      <div class="form-group"><label>供应商</label><input id="fiSupplier" maxlength="200"></div>
      <div class="form-group"><label><input id="fiIsKey" type="checkbox"> 关键物料</label></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveItem()">保存物料</button>
      <button class="btn btn-outline" onclick="hideItemModal()">取消</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
let expandedBomId = null;

async function loadBoms() {
  try {
    const boms = await API.get('/api/boms');
    const container = document.getElementById('bomList');
    if (boms.length === 0) {
      container.innerHTML = '<div class="card"><div class="empty-state"><div class="icon">📑</div><p>暂无BOM</p></div></div>';
      document.getElementById('bomLoading').classList.add('hidden');
      return;
    }
    container.innerHTML = await Promise.all(boms.map(async bom => {
      const items = await API.get(`/api/boms/${bom.id}/items`);
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div><strong style="font-size:16px">${escapeHtml(bom.bom_no)}</strong>
            <span style="margin-left:12px;color:#666">${escapeHtml(bom.product_model)}</span>
            <span style="margin-left:8px;color:#999;font-size:12px">版本: ${escapeHtml(bom.version)} | 编制: ${escapeHtml(bom.creator)}</span>
          </div>
          <div><button class="btn btn-primary btn-sm" onclick="addItem(${bom.id})">+ 添加物料</button></div>
        </div>
        <div style="font-size:13px;color:#666;margin-bottom:8px">图纸: ${escapeHtml(bom.drawing_no)||'—'} | 描述: ${escapeHtml(bom.description)||'—'}</div>
        ${items.length > 0 ? `<div class="table-wrap"><table><thead><tr>
          <th>#</th><th>物料编码</th><th>物料名称</th><th>规格</th><th>材质</th><th>单位</th><th>用量</th><th>损耗%</th><th>总用量</th><th>关键件</th><th>操作</th>
        </tr></thead><tbody>${items.map(item => `<tr>
          <td>${item.row_no}</td><td>${escapeHtml(item.material_code)}</td><td>${escapeHtml(item.material_name)}</td>
          <td>${escapeHtml(item.spec)}</td><td>${escapeHtml(item.material)}</td><td>${escapeHtml(item.unit)}</td>
          <td>${item.quantity}</td><td>${item.loss_rate}%</td><td><strong>${item.total_quantity}</strong></td>
          <td>${item.is_key ? '⭐' : '—'}</td>
          <td><button class="btn btn-danger btn-sm" onclick="deleteItem(${bom.id},${item.id})">删除</button></td>
        </tr>`).join('')}</tbody></table></div>` : '<p style="color:#999;font-size:13px">暂无物料明细</p>'}
      </div>`;
    })).then(arr => arr.join(''));
    document.getElementById('bomLoading').classList.add('hidden');
  } catch(e) { showToast('加载失败: '+e.message, 'error'); document.getElementById('bomLoading').classList.add('hidden'); }
}

function showAddBom() {
  document.getElementById('modalTitle').textContent = '新增BOM';
  ['fBomNo','fDrawing','fCreator','fDesc'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fVersion').value = 'V1.0';
  document.getElementById('modal').style.display = 'flex';
  loadProductSelect('fModel');
}

function hideModal() { document.getElementById('modal').style.display = 'none'; }

async function saveBom() {
  const data = {
    bom_no: document.getElementById('fBomNo').value.trim(),
    product_model: document.getElementById('fModel').value,
    drawing_no: document.getElementById('fDrawing').value.trim(),
    version: document.getElementById('fVersion').value.trim(),
    creator: document.getElementById('fCreator').value.trim(),
    description: document.getElementById('fDesc').value.trim()
  };
  if (!data.bom_no) return showToast('BOM编号不能为空', 'error');
  if (!data.product_model) return showToast('请选择产品型号', 'error');
  try { await API.post('/api/boms', data); showToast('新增BOM成功'); hideModal(); loadBoms(); }
  catch(e) { showToast(e.message, 'error'); }
}

let itemBomId = null;

function hideItemModal() { document.getElementById('itemModal').style.display = 'none'; itemBomId = null; }

function addItem(bomId) {
  itemBomId = bomId;
  document.getElementById('fiRowNo').value = 1;
  ['fiCode','fiName','fiSpec','fiMaterial','fiSupplier'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fiUnit').value = '';
  document.getElementById('fiQty').value = 1;
  document.getElementById('fiLoss').value = 0;
  document.getElementById('fiIsKey').checked = false;
  document.getElementById('itemModal').style.display = 'flex';
}

async function saveItem() {
  const data = {
    row_no: parseInt(document.getElementById('fiRowNo').value) || 0,
    material_code: document.getElementById('fiCode').value.trim(),
    material_name: document.getElementById('fiName').value.trim(),
    spec: document.getElementById('fiSpec').value.trim(),
    material: document.getElementById('fiMaterial').value.trim(),
    unit: document.getElementById('fiUnit').value,
    quantity: parseFloat(document.getElementById('fiQty').value) || 0,
    loss_rate: parseFloat(document.getElementById('fiLoss').value) || 0,
    is_key: document.getElementById('fiIsKey').checked ? 1 : 0,
    supplier: document.getElementById('fiSupplier').value.trim()
  };
  if (!data.material_name) return showToast('物料名称不能为空', 'error');
  if (!data.quantity || data.quantity <= 0) return showToast('用量必须大于0', 'error');
  try {
    await API.post(`/api/boms/${itemBomId}/items`, data);
    showToast('物料添加成功');
    hideItemModal();
    loadBoms();
  } catch(e) { showToast(e.message, 'error'); }
}

async function deleteItem(bomId, itemId) {
  if (!confirm('确定删除该物料？')) return;
  try { await API.del(`/api/boms/${bomId}/items/${itemId}`); showToast('删除成功'); loadBoms(); }
  catch(e) { showToast(e.message, 'error'); }
}

loadBoms();
</script>
<script>
async function doSearch() {
  const q = document.getElementById('globalSearch').value.trim();
  if (!q) return;
  try {
    const results = await API.get('/api/search?q='+encodeURIComponent(q));
    let html = '<div style="max-height:400px;overflow-y:auto">';
    if (results.products.length) html += '<h4 style="margin:8px 0">📦 产品</h4>'+results.products.map(p => '<div class="search-result-item"><a href="/products.html">'+escapeHtml(p.model)+(p.name ? ' - '+escapeHtml(p.name) : '')+'</a></div>').join('');
    if (results.ledger.length) html += '<h4 style="margin:8px 0">📋 测试台账</h4>'+results.ledger.map(r => '<div class="search-result-item"><a href="/ledger.html">'+escapeHtml(r.test_item)+' ('+escapeHtml(r.product_model)+' - '+escapeHtml(r.batch_no)+')</a> '+judgmentBadge(r.judgment)+'</div>').join('');
    if (results.boms.length) html += '<h4 style="margin:8px 0">📑 BOM</h4>'+results.boms.map(b => '<div class="search-result-item"><a href="/bom.html">'+escapeHtml(b.bom_no)+' - '+escapeHtml(b.product_model)+'</a></div>').join('');
    if (results.process.length) html += '<h4 style="margin:8px 0">🔧 工艺记录</h4>'+results.process.map(p => '<div class="search-result-item"><a href="/process.html">'+escapeHtml(p.record_no)+' - '+escapeHtml(p.product_model)+'</a></div>').join('');
    if (results.reports.length) html += '<h4 style="margin:8px 0">📝 测试报告</h4>'+results.reports.map(r => '<div class="search-result-item"><a href="/reports.html">'+escapeHtml(r.report_no)+' - '+escapeHtml(r.product_model)+'</a></div>').join('');
    if (!results.products.length && !results.ledger.length && !results.boms.length && !results.process.length && !results.reports.length) html += '<p style="color:#999;text-align:center;padding:20px">未找到相关结果</p>';
    html += '</div>';
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-start;justify-content:center;z-index:300;padding-top:80px';
    modal.onclick = function(e) { if (e.target === this) this.remove(); };
    modal.innerHTML = '<div style="background:#fff;border-radius:12px;padding:24px;min-width:400px;max-width:600px;max-height:70vh;overflow-y:auto">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3>搜索: '+escapeHtml(q)+'</h3><button onclick="this.closest(\'.modal-overlay\').remove()" style="background:none;border:none;font-size:20px;cursor:pointer">✕</button></div>' +
      html + '</div>';
    document.body.appendChild(modal);
  } catch(e) { showToast('搜索失败: '+e.message, 'error'); }
}
</script>
</body>
</html>
