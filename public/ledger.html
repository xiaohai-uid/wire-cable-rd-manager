<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>测试台账 - 线材研发管理系统</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="navbar">
  <div class="logo">📐 <span>线材研发</span>管理系统</div>
  <div class="nav-links">
    <a href="/">📊 仪表盘</a>
    <a href="/products.html">📦 产品</a>
    <a href="/ledger.html" class="active">📋 测试台账</a>
    <a href="/bom.html">📑 BOM</a>
    <a href="/process.html">🔧 工艺记录</a>
    <a href="/reports.html">📝 测试报告</a>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <input id="globalSearch" placeholder="搜索..." style="padding:6px 12px;border:none;border-radius:6px;font-size:13px;width:160px;background:rgba(255,255,255,0.15);color:#fff;outline:none" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()" style="background:none;border:none;color:#fff;cursor:pointer;font-size:16px">🔍</button>
  </div>
</div>
<div class="container">
  <div class="page-header"><h2>📋 测试台账</h2><div style="display:flex;gap:8px"><button class="btn btn-primary" onclick="showAddForm()">+ 新增测试</button><button class="btn btn-success" onclick="exportCSV()">📥 导出 CSV</button><button class="btn btn-outline" onclick="triggerImport()">📥 导入 CSV</button></div></div>

<!-- 隐藏的CSV文件输入 -->
<input type="file" id="csvFileInput" accept=".csv" style="display:none" onchange="importCSV(this)">

  <!-- 筛选 -->
  <div class="card">
    <div class="filter-bar">
      <div class="form-group"><label>产品型号</label><select id="filterModel" onchange="loadLedger()"></select></div>
      <div class="form-group"><label>批号</label><input id="filterBatch" maxlength="200" placeholder="批号" onchange="loadLedger()"></div>
      <div class="form-group"><label>判定</label><select id="filterJudgment" onchange="loadLedger()">
        <option value="">全部</option><option value="合格">合格</option><option value="不合格">不合格</option>
      </select></div>
      <button class="btn btn-outline" onclick="clearFilter()">清除筛选</button>
    </div>
  </div>

  <!-- 统计 -->
  <div class="stats-grid" id="ledgerStats" style="margin-bottom:16px;grid-template-columns:repeat(4,1fr)">
    <div class="stat-card total"><div class="stat-label">当前筛选</div><div class="stat-value" id="filterTotal">0</div></div>
    <div class="stat-card pass"><div class="stat-label">合格</div><div class="stat-value" id="filterPass">0</div></div>
    <div class="stat-card fail"><div class="stat-label">不合格</div><div class="stat-value" id="filterFail">0</div></div>
    <div class="stat-card rate"><div class="stat-label">不良率</div><div class="stat-value" id="filterRate">0%</div></div>
  </div>

  <!-- 表格 -->
  <div class="card">
    <div id="ledgerLoading" class="loading-overlay" style="min-height:120px"><div class="loading-spinner"></div></div>
    <div class="table-wrap"><table><thead>
      <tr><th>日期</th><th>产品型号</th><th>批号</th><th>测试项目</th><th>规格</th><th>值1</th><th>值2</th><th>值3</th><th>平均值</th><th>判定</th><th>不良原因</th><th>测试人</th><th>操作</th></tr>
    </thead><tbody id="ledgerTable"></tbody></table></div>
    <div class="empty-state" id="emptyState" style="display:none"><div class="icon">📋</div><p>暂无测试记录</p></div>
  </div>
</div>

<!-- 新增/编辑模态框 -->
<div class="modal-overlay" id="modal" style="display:none" onclick="if(event.target===this)hideModal()">
  <div class="modal" style="min-width:600px"><h3 id="modalTitle">新增测试记录</h3>
    <div class="form-grid">
      <div class="form-group"><label>测试日期 *</label><input id="fDate" type="date"></div>
      <div class="form-group"><label>产品型号</label><select id="fModel" onchange="onModelChange()"></select></div>
      <div class="form-group"><label>图纸编号</label><input id="fDrawing" maxlength="200" placeholder="自动带出或手动输入"></div>
      <div class="form-group"><label>BOM编号</label><input id="fBom" maxlength="200" placeholder="可选"></div>
      <div class="form-group"><label>批号/炉号</label><input id="fBatch" maxlength="200" placeholder="如 BATCH-001"></div>
      <div class="form-group"><label>样品编号</label><input id="fSample" maxlength="200" placeholder="如 S-001"></div>
      <div class="form-group"><label>测试项目 *</label>
        <div style="display:flex;gap:4px">
          <select id="fItem" style="flex:1"><option value="">选择测试项目</option>
            <option value="导体电阻">导体电阻</option><option value="绝缘耐压">绝缘耐压</option>
            <option value="外径尺寸">外径尺寸</option><option value="伸长率">伸长率</option>
            <option value="老化测试">老化测试</option><option value="外观检查">外观检查</option>
            <option value="导通测试">导通测试</option><option value="绝缘电阻">绝缘电阻</option>
            <option value="其他">其他</option>
          </select>
          <button class="btn btn-outline btn-sm" id="btnLoadTmpl" onclick="loadNextTemplate()" style="display:none;white-space:nowrap">载入模板</button>
          <span id="tmplProgress" style="font-size:12px;color:#999;display:none;align-self:center"></span>
        </div></div>
      <div class="form-group"><label>规格要求</label><input id="fSpec" maxlength="500" placeholder="如 ≤0.5Ω / ≥1000V / 5.0±0.1mm"></div>
      <div class="form-group" style="grid-column:1/-1"><label>测试值</label>
        <div class="form-row-3">
          <input id="fV1" type="number" step="any" placeholder="测试值1">
          <input id="fV2" type="number" step="any" placeholder="测试值2">
          <input id="fV3" type="number" step="any" placeholder="测试值3">
        </div>
      </div>
      <div class="form-group"><label>测试人</label><input id="fTester" maxlength="200" placeholder="姓名"></div>
      <div class="form-group"><label>不良原因</label><input id="fReason" maxlength="500" placeholder="如不合格则填写原因"></div>
    </div>
    <div class="form-group"><label>备注</label><input id="fRemark" maxlength="500" placeholder="可选"></div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveRecord()">保存</button>
      <button class="btn btn-success" onclick="saveAndContinue()">保存并继续新增</button>
      <button class="btn btn-outline" onclick="hideModal()">取消</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
let editId = null;

async function loadLedger() {
  try {
    const model = document.getElementById('filterModel').value;
    const batch = document.getElementById('filterBatch').value;
    const judgment = document.getElementById('filterJudgment').value;
    let url = '/api/ledger?';
    if (model) url += 'product_model='+encodeURIComponent(model)+'&';
    if (batch) url += 'batch_no='+encodeURIComponent(batch)+'&';
    if (judgment) url += 'judgment='+encodeURIComponent(judgment);
    
    const records = await API.get(url);
    const tbody = document.getElementById('ledgerTable');
    const empty = document.getElementById('emptyState');
    
    if (records.length === 0) { tbody.innerHTML = ''; empty.style.display = 'block'; }
    else { empty.style.display = 'none';
      tbody.innerHTML = records.map(r => `<tr class="${r.judgment === '不合格' ? 'fail' : ''}">
        <td>${escapeHtml(r.test_date)}</td>
        <td>${escapeHtml(r.product_model)}</td>
        <td>${escapeHtml(r.batch_no)}</td>
        <td>${escapeHtml(r.test_item)}</td>
        <td>${escapeHtml(r.spec)}</td>
        <td>${r.value1 ?? ''}</td><td>${r.value2 ?? ''}</td><td>${r.value3 ?? ''}</td>
        <td><strong>${r.avg_value ?? '—'}</strong></td>
        <td>${judgmentBadge(r.judgment)}</td>
        <td style="color:${r.defect_reason ? '#c62828' : '#999'}">${escapeHtml(r.defect_reason) || '—'}</td>
        <td>${escapeHtml(r.tester)}</td>
        <td><button class="btn btn-outline btn-sm" onclick="editRecord(${r.id})">编辑</button>
            <button class="btn btn-danger btn-sm" onclick="deleteRecord(${r.id})">删除</button></td>
      </tr>`).join('');
    }
    
    // 更新统计
    const total = records.length;
    const pass = records.filter(r => r.judgment === '合格').length;
    const fail = records.filter(r => r.judgment === '不合格').length;
    document.getElementById('filterTotal').textContent = total;
    document.getElementById('filterPass').textContent = pass;
    document.getElementById('filterFail').textContent = fail;
    document.getElementById('filterRate').textContent = total > 0 ? (fail/total*100).toFixed(1)+'%' : '0%';
    document.getElementById('ledgerLoading').classList.add('hidden');
  } catch(e) { showToast('加载失败: '+e.message, 'error'); document.getElementById('ledgerLoading').classList.add('hidden'); }
}

function clearFilter() {
  document.getElementById('filterModel').value = '';
  document.getElementById('filterBatch').value = '';
  document.getElementById('filterJudgment').value = '';
  loadLedger();
}

function showAddForm() {
  editId = null;
  document.getElementById('modalTitle').textContent = '新增测试记录';
  document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
  ['fModel','fDrawing','fBom','fBatch','fSample','fItem','fSpec','fV1','fV2','fV3','fTester','fReason','fRemark'].forEach(id => {
    const el = document.getElementById(id);
    if (el && el.type !== 'date') el.value = '';
  });
  document.getElementById('modal').style.display = 'flex';
  loadProductSelect('fModel');
}

async function editRecord(id) {
  editId = id;
  document.getElementById('modalTitle').textContent = '编辑测试记录';
  try {
    const r = await API.get('/api/ledger/'+id);
    document.getElementById('fDate').value = r.test_date;
    document.getElementById('fModel').value = r.product_model;
    document.getElementById('fDrawing').value = r.drawing_no;
    document.getElementById('fBom').value = r.bom_no;
    document.getElementById('fBatch').value = r.batch_no;
    document.getElementById('fSample').value = r.sample_no;
    document.getElementById('fItem').value = r.test_item;
    document.getElementById('fSpec').value = r.spec;
    document.getElementById('fV1').value = r.value1;
    document.getElementById('fV2').value = r.value2;
    document.getElementById('fV3').value = r.value3;
    document.getElementById('fTester').value = r.tester;
    document.getElementById('fReason').value = r.defect_reason;
    document.getElementById('fRemark').value = r.remark;
    document.getElementById('modal').style.display = 'flex';
    loadProductSelect('fModel');
  } catch(e) { showToast(e.message, 'error'); }
}

function hideModal() { document.getElementById('modal').style.display = 'none'; }

function getFormData() {
  return {
    test_date: document.getElementById('fDate').value,
    product_model: document.getElementById('fModel').value,
    drawing_no: document.getElementById('fDrawing').value.trim(),
    bom_no: document.getElementById('fBom').value.trim(),
    batch_no: document.getElementById('fBatch').value.trim(),
    sample_no: document.getElementById('fSample').value.trim(),
    test_item: document.getElementById('fItem').value,
    spec: document.getElementById('fSpec').value.trim(),
    value1: document.getElementById('fV1').value === '' ? null : parseFloat(document.getElementById('fV1').value),
    value2: document.getElementById('fV2').value === '' ? null : parseFloat(document.getElementById('fV2').value),
    value3: document.getElementById('fV3').value === '' ? null : parseFloat(document.getElementById('fV3').value),
    tester: document.getElementById('fTester').value.trim(),
    defect_reason: document.getElementById('fReason').value.trim(),
    remark: document.getElementById('fRemark').value.trim()
  };
}

async function saveRecord() {
  const data = getFormData();
  if (!data.test_date) return showToast('请选择测试日期', 'error');
  if (!data.test_item) return showToast('请选择测试项目', 'error');
  try {
    if (editId) { await API.put(`/api/ledger/${editId}`, data); showToast('更新成功'); }
    else { await API.post('/api/ledger', data); showToast('新增成功'); }
    hideModal(); loadLedger();
  } catch(e) { showToast(e.message, 'error'); }
}

async function saveAndContinue() {
  const data = getFormData();
  if (!data.test_date) return showToast('请选择测试日期', 'error');
  if (!data.test_item) return showToast('请选择测试项目', 'error');
  try {
    await API.post('/api/ledger', data);
    showToast('保存成功，继续录入');
    // 清空测试值、样品编号，保留产品信息和批号
    ['fV1','fV2','fV3','fSample','fReason','fRemark'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('fItem').value = '';
    document.getElementById('fSpec').value = '';
    loadLedger();
  } catch(e) { showToast(e.message, 'error'); }
}

async function deleteRecord(id) {
  if (!confirm('确定删除该测试记录？')) return;
  try { await API.del(`/api/ledger/${id}`); showToast('删除成功'); loadLedger(); }
  catch(e) { showToast(e.message, 'error'); }
}

loadProductSelect('filterModel');
loadLedger();

function exportCSV() {
  const model = document.getElementById('filterModel').value;
  const batch = document.getElementById('filterBatch').value;
  let url = '/api/ledger/export?';
  if (model) url += 'product_model='+encodeURIComponent(model)+'&';
  if (batch) url += 'batch_no='+encodeURIComponent(batch);
  window.open(url, '_blank');
}

function triggerImport() { document.getElementById('csvFileInput').click(); }
async function importCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const text = await file.text();
  try {
    const result = await API.post('/api/ledger/import', { csv: text });
    showToast('导入完成: 共'+result.total+'条, 成功'+result.success+'条, 失败'+result.failed+'条', result.failed > 0 ? 'warning' : 'success');
    loadLedger();
  } catch(e) { showToast('导入失败: '+e.message, 'error'); }
  input.value = '';
}

async function doSearch() {
  const q = document.getElementById('globalSearch').value.trim();
  if (!q) return;
  try {
    const results = await API.get('/api/search?q='+encodeURIComponent(q));
    let html = '<div style="max-height:400px;overflow-y:auto">';
    if (results.products.length) html += '<h4 style="margin:8px 0">📦 产品</h4>'+results.products.map(p => '<div class="search-result-item"><a href="/products.html">'+escapeHtml(p.model)+(p.name ? ' - '+escapeHtml(p.name) : '')+'</a></div>').join('');
    if (results.ledger.length) html += '<h4 style="margin:8px 0">📋 测试台账</h4>'+results.ledger.map(r => '<div class="search-result-item"><a href="/ledger.html">'+escapeHtml(r.test_item)+' ('+escapeHtml(r.product_model)+' - '+escapeHtml(r.batch_no)+')</a> '+judgmentBadge(r.judgment)+'</div>').join('');
    if (results.boms.length) html += '<h4 style="margin:8px 0">📑 BOM</h4>'+results.boms.map(b => '<div class="search-result-item"><a href="/bom.html">'+escapeHtml(b.bom_no)+' - '+escapeHtml(b.product_model)+'</a></div>').join('');
    if (results.process.length) html += '<h4 style="margin:8px 0">🔧 工艺记录</h4>'+results.process.map(p => '<div class="search-result-item"><a href="/process.html">'+escapeHtml(p.record_no)+' - '+escapeHtml(p.product_model)+'</a></div>').join('');
    if (results.reports.length) html += '<h4 style="margin:8px 0">📝 测试报告</h4>'+results.reports.map(r => '<div class="search-result-item"><a href="/reports.html">'+escapeHtml(r.report_no)+' - '+escapeHtml(r.product_model)+'</a></div>').join('');
    if (!results.products.length && !results.ledger.length && !results.boms.length && !results.process.length && !results.reports.length) html += '<p style="color:#999;text-align:center;padding:20px">未找到相关结果</p>';
    html += '</div>';
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-start;justify-content:center;z-index:300;padding-top:80px';
    modal.onclick = function(e) { if (e.target === this) this.remove(); };
    modal.innerHTML = '<div style="background:#fff;border-radius:12px;padding:24px;min-width:400px;max-width:600px;max-height:70vh;overflow-y:auto">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3>搜索: '+escapeHtml(q)+'</h3><button onclick="this.closest(\'.modal-overlay\').remove()" style="background:none;border:none;font-size:20px;cursor:pointer">✕</button></div>' +
      html + '</div>';
    document.body.appendChild(modal);
  } catch(e) { showToast('搜索失败: '+e.message, 'error'); }
}

// ===== 产品测试模板自动加载 =====
let currentTemplates = [];
let currentTmplIndex = 0;

async function onModelChange() {
  const model = document.getElementById('fModel').value;
  const btn = document.getElementById('btnLoadTmpl');
  const progress = document.getElementById('tmplProgress');
  if (!model) { btn.style.display = 'none'; progress.style.display = 'none'; currentTemplates = []; return; }
  try {
    currentTemplates = await API.get('/api/templates?product_model='+encodeURIComponent(model));
    if (currentTemplates.length > 0) {
      currentTmplIndex = 0;
      btn.style.display = 'inline-block';
      progress.style.display = 'inline-block';
      progress.textContent = '1/'+currentTemplates.length;
      btn.textContent = '载入模板 (1/'+currentTemplates.length+')';
    } else {
      btn.style.display = 'none';
      progress.style.display = 'none';
    }
  } catch(e) { console.error(e); }
}

function loadNextTemplate() {
  if (currentTemplates.length === 0) return;
  const t = currentTemplates[currentTmplIndex];
  document.getElementById('fItem').value = t.test_item;
  document.getElementById('fSpec').value = t.spec || '';
  currentTmplIndex = (currentTmplIndex + 1) % currentTemplates.length;
  const btn = document.getElementById('btnLoadTmpl');
  const progress = document.getElementById('tmplProgress');
  const next = currentTmplIndex + 1;
  btn.textContent = '载入模板 ('+next+'/'+currentTemplates.length+')';
  progress.textContent = next+'/'+currentTemplates.length;
}
</script>
</body>
</html>
