<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工艺记录 - 线材研发管理系统</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="navbar">
  <div class="logo">📐 <span>线材研发</span>管理系统</div>
  <div class="nav-links">
    <a href="/">📊 仪表盘</a><a href="/products.html">📦 产品</a><a href="/ledger.html">📋 测试台账</a>
    <a href="/bom.html">📑 BOM</a><a href="/process.html" class="active">🔧 工艺记录</a><a href="/reports.html">📝 测试报告</a>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <input id="globalSearch" placeholder="搜索..." style="padding:6px 12px;border:none;border-radius:6px;font-size:13px;width:160px;background:rgba(255,255,255,0.15);color:#fff;outline:none" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()" style="background:none;border:none;color:#fff;cursor:pointer;font-size:16px">🔍</button>
  </div>
</div>
<div class="container">
  <div class="page-header"><h2>🔧 打样工艺记录</h2><button class="btn btn-primary" onclick="showAddForm()">+ 新增工艺记录</button></div>
  <div id="procLoading" class="loading-overlay"><div class="loading-spinner"></div></div>
  <div id="processList"></div>
</div>

<div class="modal-overlay" id="modal" style="display:none" onclick="if(event.target===this)hideModal()">
  <div class="modal" style="min-width:500px"><h3 id="modalTitle">新增工艺记录</h3>
    <div class="form-grid">
      <div class="form-group"><label>记录编号 *</label><input id="fNo" maxlength="200" placeholder="如 GY-XH-100P-B001"></div>
      <div class="form-group"><label>产品型号</label><select id="fModel"></select></div>
      <div class="form-group"><label>图纸编号</label><input id="fDrawing" maxlength="200"></div>
      <div class="form-group"><label>BOM编号</label><input id="fBom" maxlength="200"></div>
      <div class="form-group"><label>批次号</label><input id="fBatch" maxlength="200"></div>
      <div class="form-group"><label>日期</label><input id="fDate" type="date"></div>
      <div class="form-group"><label>数量</label><input id="fQty" type="number" step="any" maxlength="200"></div>
      <div class="form-group"><label>单位</label><input id="fUnit" maxlength="200" value="m"></div>
      <div class="form-group"><label>负责人</label><input id="fResp" maxlength="200"></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveProcess()">保存</button>
      <button class="btn btn-outline" onclick="hideModal()">取消</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="paramModal" style="display:none" onclick="if(event.target===this)hideParamModal()">
  <div class="modal" style="min-width:500px"><h3>添加工艺参数</h3>
    <div class="form-grid">
      <div class="form-group"><label>工序名称</label><input id="pName" maxlength="200" placeholder="如 导体绞合"></div>
      <div class="form-group"><label>参数名称</label><input id="pParam" maxlength="200" placeholder="如 绞距"></div>
      <div class="form-group"><label>规格要求</label><input id="pSpec" maxlength="500" placeholder="如 20±1mm"></div>
      <div class="form-group" style="grid-column:1/-1"><label>实际值</label>
        <div class="form-row-3"><input id="pV1" type="number" step="any" placeholder="值1">
          <input id="pV2" type="number" step="any" placeholder="值2">
          <input id="pV3" type="number" step="any" placeholder="值3"></div>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveParam()">保存</button>
      <button class="btn btn-outline" onclick="hideParamModal()">取消</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
let currentProcessId = null;

async function loadProcesses() {
  try {
    const records = await API.get('/api/process');
    const container = document.getElementById('processList');
    if (records.length === 0) {
      container.innerHTML = '<div class="card"><div class="empty-state"><div class="icon">🔧</div><p>暂无工艺记录</p></div></div>';
      document.getElementById('procLoading').classList.add('hidden');
      return;
    }
    container.innerHTML = await Promise.all(records.map(async rec => {
      const params = await API.get(`/api/process/${rec.id}/params`);
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div><strong style="font-size:16px">${escapeHtml(rec.record_no)}</strong>
            <span style="margin-left:12px;color:#666">${escapeHtml(rec.product_model)}</span>
            <span style="margin-left:8px;color:#999;font-size:12px">${escapeHtml(rec.batch_no)} | ${escapeHtml(rec.process_date)} | 负责人: ${escapeHtml(rec.responsible)}</span>
          </div>
          <div><button class="btn btn-primary btn-sm" onclick="addParam(${rec.id})">+ 添加工艺参数</button></div>
        </div>
        <div style="font-size:13px;color:#666;margin-bottom:8px">图纸: ${escapeHtml(rec.drawing_no)||'—'} | BOM: ${escapeHtml(rec.bom_no)||'—'} | 数量: ${rec.quantity}${escapeHtml(rec.unit)}</div>
        ${params.length > 0 ? `<div class="table-wrap"><table><thead><tr>
          <th>工序</th><th>参数</th><th>规格</th><th>实际1</th><th>实际2</th><th>实际3</th><th>判定</th>
        </tr></thead><tbody>${params.map(p => `<tr>
          <td>${escapeHtml(p.process_name)}</td><td>${escapeHtml(p.param_name)}</td>
          <td>${escapeHtml(p.spec)}</td><td>${p.actual1 ?? ''}</td><td>${p.actual2 ?? ''}</td><td>${p.actual3 ?? ''}</td>
          <td>${judgmentBadge(p.judgment)}</td>
        </tr>`).join('')}</tbody></table></div>` : '<p style="color:#999;font-size:13px">暂无工艺参数</p>'}
      </div>`;
    })).then(arr => arr.join(''));
    document.getElementById('procLoading').classList.add('hidden');
  } catch(e) { showToast('加载失败: '+e.message, 'error'); document.getElementById('procLoading').classList.add('hidden'); }
}

function showAddForm() {
  document.getElementById('modalTitle').textContent = '新增工艺记录';
  ['fNo','fDrawing','fBom','fBatch','fResp'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('fQty').value = '';
  document.getElementById('fUnit').value = 'm';
  document.getElementById('modal').style.display = 'flex';
  loadProductSelect('fModel');
}

function hideModal() { document.getElementById('modal').style.display = 'none'; }

async function saveProcess() {
  const data = {
    record_no: document.getElementById('fNo').value.trim(),
    product_model: document.getElementById('fModel').value,
    drawing_no: document.getElementById('fDrawing').value.trim(),
    bom_no: document.getElementById('fBom').value.trim(),
    batch_no: document.getElementById('fBatch').value.trim(),
    process_date: document.getElementById('fDate').value,
    quantity: parseFloat(document.getElementById('fQty').value) || 0,
    unit: document.getElementById('fUnit').value.trim() || 'm',
    responsible: document.getElementById('fResp').value.trim()
  };
  if (!data.record_no) return showToast('记录编号不能为空', 'error');
  try { await API.post('/api/process', data); showToast('新增成功'); hideModal(); loadProcesses(); }
  catch(e) { showToast(e.message, 'error'); }
}

function addParam(processId) {
  currentProcessId = processId;
  ['pName','pParam','pSpec','pV1','pV2','pV3'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('paramModal').style.display = 'flex';
}

function hideParamModal() { document.getElementById('paramModal').style.display = 'none'; currentProcessId = null; }

async function saveParam() {
  const data = {
    process_name: document.getElementById('pName').value.trim(),
    param_name: document.getElementById('pParam').value.trim(),
    spec: document.getElementById('pSpec').value.trim(),
    actual1: parseFloat(document.getElementById('pV1').value) || null,
    actual2: parseFloat(document.getElementById('pV2').value) || null,
    actual3: parseFloat(document.getElementById('pV3').value) || null
  };
  try { await API.post(`/api/process/${currentProcessId}/params`, data); showToast('参数添加成功'); hideParamModal(); loadProcesses(); }
  catch(e) { showToast(e.message, 'error'); }
}

const pl = document.getElementById('procLoading'); if (pl) pl.classList.add('hidden');
loadProcesses();
</script>
<script>
async function doSearch() {
  const q = document.getElementById('globalSearch').value.trim();
  if (!q) return;
  try {
    const results = await API.get('/api/search?q='+encodeURIComponent(q));
    let html = '<div style="max-height:400px;overflow-y:auto">';
    if (results.products.length) html += '<h4 style="margin:8px 0">📦 产品</h4>'+results.products.map(p => '<div class="search-result-item"><a href="/products.html">'+escapeHtml(p.model)+(p.name ? ' - '+escapeHtml(p.name) : '')+'</a></div>').join('');
    if (results.ledger.length) html += '<h4 style="margin:8px 0">📋 测试台账</h4>'+results.ledger.map(r => '<div class="search-result-item"><a href="/ledger.html">'+escapeHtml(r.test_item)+' ('+escapeHtml(r.product_model)+' - '+escapeHtml(r.batch_no)+')</a> '+judgmentBadge(r.judgment)+'</div>').join('');
    if (results.boms.length) html += '<h4 style="margin:8px 0">📑 BOM</h4>'+results.boms.map(b => '<div class="search-result-item"><a href="/bom.html">'+escapeHtml(b.bom_no)+' - '+escapeHtml(b.product_model)+'</a></div>').join('');
    if (results.process.length) html += '<h4 style="margin:8px 0">🔧 工艺记录</h4>'+results.process.map(p => '<div class="search-result-item"><a href="/process.html">'+escapeHtml(p.record_no)+' - '+escapeHtml(p.product_model)+'</a></div>').join('');
    if (results.reports.length) html += '<h4 style="margin:8px 0">📝 测试报告</h4>'+results.reports.map(r => '<div class="search-result-item"><a href="/reports.html">'+escapeHtml(r.report_no)+' - '+escapeHtml(r.product_model)+'</a></div>').join('');
    if (!results.products.length && !results.ledger.length && !results.boms.length && !results.process.length && !results.reports.length) html += '<p style="color:#999;text-align:center;padding:20px">未找到相关结果</p>';
    html += '</div>';
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-start;justify-content:center;z-index:300;padding-top:80px';
    modal.onclick = function(e) { if (e.target === this) this.remove(); };
    modal.innerHTML = '<div style="background:#fff;border-radius:12px;padding:24px;min-width:400px;max-width:600px;max-height:70vh;overflow-y:auto">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3>搜索: '+escapeHtml(q)+'</h3><button onclick="this.closest(\'.modal-overlay\').remove()" style="background:none;border:none;font-size:20px;cursor:pointer">✕</button></div>' +
      html + '</div>';
    document.body.appendChild(modal);
  } catch(e) { showToast('搜索失败: '+e.message, 'error'); }
}
</script>
</body>
</html>
