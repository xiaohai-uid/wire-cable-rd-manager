<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>线材研发管理系统</title><link rel="stylesheet" href="/css/style.css"></head>
<body>

<div class="navbar">
  <div class="logo">📐 <span>线材研发</span>管理系统</div>
  <div class="nav-links">
    <a href="/" class="active">📊 仪表盘</a>
    <a href="/products.html">📦 产品</a>
    <a href="/ledger.html">📋 测试台账</a>
    <a href="/bom.html">📑 BOM</a>
    <a href="/process.html">🔧 工艺记录</a>
    <a href="/reports.html">📝 测试报告</a>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <input id="globalSearch" placeholder="搜索..." style="padding:6px 12px;border:none;border-radius:6px;font-size:13px;width:160px;background:rgba(255,255,255,0.15);color:#fff;outline:none" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()" style="background:none;border:none;color:#fff;cursor:pointer;font-size:16px">🔍</button>
  </div>
</div>

<div class="container">
  <div class="page-header"><h2>📊 仪表盘</h2></div>

  <div id="dashLoading" class="loading-overlay"><div class="loading-spinner"></div></div>

  <div class="stats-grid" id="statsGrid">
    <div class="stat-card total"><div class="stat-label">总测试数</div><div class="stat-value" id="statTotal">—</div></div>
    <div class="stat-card pass"><div class="stat-label">合格数</div><div class="stat-value" id="statPass">—</div></div>
    <div class="stat-card fail"><div class="stat-label">不合格数</div><div class="stat-value" id="statFail">—</div></div>
    <div class="stat-card rate"><div class="stat-label">不良率</div><div class="stat-value" id="statRate">—</div></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-title">⚡ 快速操作</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <a href="/ledger.html" class="btn btn-primary">➕ 新增测试</a>
      <a href="/reports.html" class="btn btn-success">📝 生成报告</a>
      <a href="/products.html" class="btn btn-outline">📦 管理产品</a>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📈 不良率趋势（近7天）</div>
    <div class="chart-container"><canvas id="trendChart"></canvas></div>
  </div>

  <div class="card">
    <div class="card-title">最近测试记录</div>
    <div class="table-wrap"><table><thead>
      <tr><th>日期</th><th>产品型号</th><th>批号</th><th>测试项目</th><th>平均值</th><th>判定</th><th>测试人</th></tr>
    </thead><tbody id="recentTable"></tbody></table></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
async function loadDashboard() {
  try {
    const [stats, records, trend] = await Promise.all([
      API.get('/api/ledger/stats'),
      API.get('/api/ledger'),
      API.get('/api/ledger/trend?days=7')
    ]);
    $('statTotal').textContent = stats.total;
    $('statPass').textContent = stats.pass_count;
    $('statFail').textContent = stats.fail_count;
    $('statRate').textContent = stats.defect_rate + '%';

    const recent = records.slice(0, 10);
    $('recentTable').innerHTML = recent.map(r => `
      <tr class="${r.judgment === '不合格' ? 'fail' : ''}">
        <td>${escapeHtml(r.test_date)}</td>
        <td>${escapeHtml(r.product_model)}</td>
        <td>${escapeHtml(r.batch_no)}</td>
        <td>${escapeHtml(r.test_item)}</td>
        <td>${r.avg_value ?? '—'}</td>
        <td>${judgmentBadge(r.judgment)}</td>
        <td>${escapeHtml(r.tester)}</td>
      </tr>`).join('');

    drawTrend(trend);
    document.getElementById('dashLoading').classList.add('hidden');
  } catch(e) { showToast('加载数据失败: ' + e.message, 'error'); document.getElementById('dashLoading').classList.add('hidden'); }
}

function drawTrend(data) {
  const canvas = document.getElementById('trendChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = 250;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  if (!data || data.length === 0) {
    ctx.fillStyle = '#999'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('暂无数据', canvas.width / 2, canvas.height / 2);
    return;
  }

  const pad = { top: 20, right: 20, bottom: 40, left: 50 };
  const w = canvas.width - pad.left - pad.right;
  const h = canvas.height - pad.top - pad.bottom;

  // 计算最大不良率（至少25%用于网格）
  const maxRate = Math.max(25, ...data.map(d => d.rate)) * 1.2;
  const gridLines = 5;

  // 网格
  ctx.strokeStyle = '#eee'; ctx.lineWidth = 1;
  for (let i = 0; i <= gridLines; i++) {
    const y = pad.top + h * (1 - i / gridLines);
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + w, y); ctx.stroke();
    ctx.fillStyle = '#999'; ctx.font = '12px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(Math.round(i * maxRate / gridLines) + '%', pad.left - 8, y + 4);
  }

  // 折线
  const points = data.map((d, i) => ({
    x: pad.left + w * i / (data.length - 1),
    y: pad.top + h * (1 - d.rate / maxRate)
  }));

  // 填充区域
  ctx.beginPath();
  ctx.moveTo(points[0].x, pad.top + h);
  points.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.lineTo(points[points.length - 1].x, pad.top + h);
  ctx.closePath();
  ctx.fillStyle = 'rgba(26,35,126,0.08)';
  ctx.fill();

  // 线
  ctx.strokeStyle = '#1a237e'; ctx.lineWidth = 2;
  ctx.beginPath();
  points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.stroke();

  // 点 + 标签
  data.forEach((d, i) => {
    const p = points[i];
    // 有数据的点加颜色
    ctx.fillStyle = d.total > 0 ? (d.rate > 0 ? '#c62828' : '#2e7d32') : '#ccc';
    ctx.beginPath(); ctx.arc(p.x, p.y, d.total > 0 ? 4 : 2, 0, Math.PI * 2); ctx.fill();
    // X轴标签
    ctx.fillStyle = '#999'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(d.label, p.x, canvas.height - 5);
  });

  // 标注值
  data.forEach((d, i) => {
    if (d.total > 0 && d.rate > 0) {
      const p = points[i];
      ctx.fillStyle = '#c62828'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(d.rate + '%', p.x, p.y - 10);
    }
  });
}

loadDashboard();
</script>
<script>
async function doSearch() {
  const q = document.getElementById('globalSearch').value.trim();
  if (!q) return;
  try {
    const results = await API.get('/api/search?q='+encodeURIComponent(q));
    let html = '<div style="max-height:400px;overflow-y:auto">';
    if (results.products.length) html += '<h4 style="margin:8px 0">📦 产品</h4>'+results.products.map(p => '<div class="search-result-item"><a href="/products.html">'+escapeHtml(p.model)+(p.name ? ' - '+escapeHtml(p.name) : '')+'</a></div>').join('');
    if (results.ledger.length) html += '<h4 style="margin:8px 0">📋 测试台账</h4>'+results.ledger.map(r => '<div class="search-result-item"><a href="/ledger.html">'+escapeHtml(r.test_item)+' ('+escapeHtml(r.product_model)+' - '+escapeHtml(r.batch_no)+')</a> '+judgmentBadge(r.judgment)+'</div>').join('');
    if (results.boms.length) html += '<h4 style="margin:8px 0">📑 BOM</h4>'+results.boms.map(b => '<div class="search-result-item"><a href="/bom.html">'+escapeHtml(b.bom_no)+' - '+escapeHtml(b.product_model)+'</a></div>').join('');
    if (results.process.length) html += '<h4 style="margin:8px 0">🔧 工艺记录</h4>'+results.process.map(p => '<div class="search-result-item"><a href="/process.html">'+escapeHtml(p.record_no)+' - '+escapeHtml(p.product_model)+'</a></div>').join('');
    if (results.reports.length) html += '<h4 style="margin:8px 0">📝 测试报告</h4>'+results.reports.map(r => '<div class="search-result-item"><a href="/reports.html">'+escapeHtml(r.report_no)+' - '+escapeHtml(r.product_model)+'</a></div>').join('');
    if (!results.products.length && !results.ledger.length && !results.boms.length && !results.process.length && !results.reports.length) html += '<p style="color:#999;text-align:center;padding:20px">未找到相关结果</p>';
    html += '</div>';
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-start;justify-content:center;z-index:300;padding-top:80px';
    modal.onclick = function(e) { if (e.target === this) this.remove(); };
    modal.innerHTML = '<div style="background:#fff;border-radius:12px;padding:24px;min-width:400px;max-width:600px;max-height:70vh;overflow-y:auto">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3>搜索: '+escapeHtml(q)+'</h3><button onclick="this.closest(\'.modal-overlay\').remove()" style="background:none;border:none;font-size:20px;cursor:pointer">✕</button></div>' +
      html + '</div>';
    document.body.appendChild(modal);
  } catch(e) { showToast('搜索失败: '+e.message, 'error'); }
}
</script>
</body>
</html>
